<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Menininho · Gestão de Mesas</title>
<!-- Firebase SDK (compat) — permite sincronização em tempo real entre todos os aparelhos -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     DESIGN TOKENS — paleta baseada na logo (verde mata + dourado sobre creme)
     ===================================================================== */
  :root{
    --color-primary:#1c6b3f;
    --color-primary-dark:#124a2b;
    --color-primary-light:#e5f1e7;
    --color-accent:#c99a2e;
    --color-accent-dark:#9c7519;
    --color-accent-light:#faf1dc;
    --color-bg:#faf7f0;
    --color-surface:#ffffff;
    --color-text:#20261f;
    --color-text-muted:#6c7568;
    --color-border:#e5e1d3;
    --color-free:#9aa093;
    --color-occupied:#1c6b3f;
    --color-billing:#c1602f;
    --color-billing-light:#fbebe1;
    --color-danger:#b03a2a;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(20,30,20,.07), 0 1px 1px rgba(20,30,20,.05);
    --shadow-md:0 6px 20px rgba(20,30,20,.10);
    --font: 'Manrope', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--color-bg);
    color:var(--color-text);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button,input,select{font-family:inherit;}
  button{-webkit-appearance:none;appearance:none;}
  h1,h2,h3{font-weight:800;letter-spacing:-.01em;}
  ::selection{background:var(--color-accent-light);}
  :focus-visible{outline:2px solid var(--color-accent-dark);outline-offset:2px;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    padding:.7rem .9rem;background:var(--color-surface);
    border-bottom:1px solid var(--color-border);
  }
  .connection-status{display:flex;align-items:center;gap:.35rem;color:var(--color-text-muted);font-size:.68rem;font-weight:800;white-space:nowrap;}
  .connection-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--color-primary);}
  .connection-status.offline{color:var(--color-danger);}
  .connection-status.offline .connection-dot{background:var(--color-danger);}
  .brand{display:flex;align-items:center;gap:.55rem;min-width:0;}
  .brand-mark{
    font-size:1.45rem;width:2.3rem;height:2.3rem;border-radius:999px;
    background:var(--color-primary-light);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    overflow:hidden;
  }
  .brand-logo{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text{min-width:0;}
  .brand-text strong{display:block;font-size:.98rem;line-height:1.1;}
  .brand-text small{display:block;color:var(--color-text-muted);font-size:.68rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topnav{display:flex;gap:.35rem;flex:0 0 auto;}
  .navbtn{
    border:1.5px solid var(--color-border);background:transparent;padding:.5rem .75rem;
    border-radius:999px;font-weight:800;font-size:.76rem;cursor:pointer;color:var(--color-text-muted);
    min-height:2.2rem;
  }
  .navbtn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}

  main.view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:.8rem .8rem 6.2rem;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;top:.9rem;transform:translate(-50%,-140%);
    background:var(--color-text);color:#fff;padding:.6rem 1.1rem;border-radius:999px;
    font-size:.85rem;font-weight:700;z-index:200;box-shadow:var(--shadow-md);
    transition:transform .25s ease;pointer-events:none;
  }
  #toast.show{transform:translate(-50%,0);}

  /* ---------- stats ---------- */
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:1.1rem;}
  @media(min-width:680px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:980px){.stats-grid{grid-template-columns:repeat(6,1fr);}}
  .stat-card{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);
    padding:.8rem .95rem;box-shadow:var(--shadow-sm);
  }
  .stat-card .stat-value{font-size:1.35rem;font-weight:800;line-height:1.15;}
  .stat-card .stat-label{font-size:.72rem;color:var(--color-text-muted);margin-top:.2rem;font-weight:700;}
  .stat-card.highlight{background:var(--color-primary);border-color:var(--color-primary);}
  .stat-card.highlight .stat-value,.stat-card.highlight .stat-label{color:#fff;}
  .stat-card.highlight .stat-label{opacity:.85;}

  /* ---------- chips ---------- */
  .chip-row{display:flex;gap:.5rem;overflow-x:auto;padding:.1rem .1rem .6rem;margin-bottom:.4rem;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1.5px solid var(--color-border);background:var(--color-surface);
    padding:.45rem .95rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--color-text-muted);
    cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--color-text);border-color:var(--color-text);color:#fff;}

  /* ---------- tables grid ---------- */
  .tables-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;}
  @media(min-width:560px){.tables-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:860px){.tables-grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:1140px){.tables-grid{grid-template-columns:repeat(5,1fr);}}

  .table-card{
    text-align:left;cursor:pointer;border-radius:var(--radius-lg);padding:.9rem .8rem;
    background:var(--color-surface);border:1.5px solid var(--color-border);box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;gap:.45rem;min-height:116px;position:relative;
    transition:transform .1s ease;
  }
  .table-card:active{transform:scale(.98);}
  .table-card-top{display:flex;align-items:center;justify-content:space-between;}
  .table-number{font-weight:800;font-size:1rem;}
  .status-dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--color-free);flex:0 0 auto;}
  .table-card.status-occupied{border-color:var(--color-primary);background:var(--color-primary-light);}
  .table-card.status-occupied .status-dot{background:var(--color-occupied);}
  .table-card.status-billing{border-color:var(--color-billing);background:var(--color-billing-light);}
  .table-card.status-billing .status-dot{background:var(--color-billing);}
  .table-status-label{font-size:.7rem;font-weight:800;letter-spacing:.02em;color:var(--color-text-muted);}
  .table-card.status-occupied .table-status-label{color:var(--color-primary-dark);}
  .table-card.status-billing .table-status-label{color:var(--color-billing);}
  .table-total{margin-top:auto;font-size:1.25rem;font-weight:800;}
  .table-meta{font-size:.7rem;color:var(--color-text-muted);font-weight:600;}

  /* ---------- table view ---------- */
  .table-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
  .iconbtn{
    width:2.5rem;height:2.5rem;border-radius:999px;border:1.5px solid var(--color-border);
    background:var(--color-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--color-text);
  }
  .table-header h1{margin:0;font-size:1.25rem;}
  .status-badge{display:inline-block;margin-top:.2rem;padding:.15rem .6rem;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.02em;background:var(--color-primary-light);color:var(--color-primary-dark);}
  .status-badge.st-free{background:#eef0eb;color:var(--color-text-muted);}
  .status-badge.st-billing{background:var(--color-billing-light);color:var(--color-billing);}

  .table-total-banner{
    background:var(--color-text);color:#fff;border-radius:var(--radius-lg);padding:1rem 1.25rem;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;
  }
  .table-total-banner span{opacity:.7;font-size:.8rem;font-weight:700;}
  .table-total-banner strong{font-size:1.65rem;}
  .checkout-review{max-width:720px;margin:0 auto;}
  .checkout-review-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
  .checkout-review-header h1{margin:0;font-size:1.35rem;}
  .checkout-review-subtitle{color:var(--color-text-muted);font-size:.82rem;font-weight:700;margin:.2rem 0 0;}
  .checkout-review-list{background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);padding:.35rem 1rem;box-shadow:var(--shadow-sm);}
  .checkout-review-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--color-border);}
  .checkout-review-item:last-child{border-bottom:none;}
  .checkout-review-item strong{display:block;font-size:.9rem;}
  .checkout-review-item small{display:block;color:var(--color-text-muted);font-size:.76rem;font-weight:600;margin-top:.15rem;}
  .checkout-review-item-total{font-weight:800;white-space:nowrap;}
  .checkout-review-total{display:flex;justify-content:space-between;align-items:center;background:var(--color-text);color:#fff;border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-top:.85rem;}
  .checkout-review-total span{font-size:.82rem;opacity:.75;font-weight:700;}
  .checkout-review-total strong{font-size:1.5rem;}
  .checkout-review-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem;}
  .checkout-review-actions .btn{min-height:3rem;}

  .table-actions{display:flex;gap:.6rem;margin-bottom:1.1rem;flex-wrap:wrap;}
  .btn{border:none;border-radius:999px;padding:.7rem 1.25rem;font-weight:800;font-size:.85rem;cursor:pointer;}
  .btn-primary{background:var(--color-primary);color:#fff;}
  .btn-accent{background:var(--color-accent);color:#2b2110;}
  .btn-outline{background:transparent;border:1.5px solid var(--color-border);color:var(--color-text);}
  .btn-danger-outline{background:transparent;border:1.5px solid var(--color-danger);color:var(--color-danger);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .table-body{display:flex;flex-direction:column;gap:1rem;}
  @media(min-width:960px){
    .table-body{flex-direction:row;align-items:flex-start;}
    .menu-panel{flex:1;min-width:0;}
    .cart-panel{width:340px;flex:0 0 340px;position:sticky;top:4.6rem;}
  }

  .search-input-wrap{position:relative;margin-bottom:.6rem;}
  .search-input-wrap svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);}
  .search-input-wrap input{
    width:100%;padding:.75rem 1rem .75rem 2.6rem;border-radius:999px;border:1.5px solid var(--color-border);
    font-size:.92rem;background:var(--color-surface);
  }

  .menu-section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);margin:1.1rem 0 .55rem;font-weight:800;}
  .menu-section-title:first-child{margin-top:0;}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem;}
  @media(min-width:520px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1140px){.menu-grid{grid-template-columns:repeat(4,1fr);}}

  .product-card{
    position:relative;background:var(--color-surface);border:1.5px solid var(--color-border);
    border-radius:var(--radius-md);padding:.95rem .6rem .8rem;display:flex;flex-direction:column;
    align-items:center;text-align:center;gap:.3rem;cursor:pointer;user-select:none;box-shadow:var(--shadow-sm);
  }
  .product-card:active{transform:scale(.96);}
  .product-card.has-qty{border-color:var(--color-primary);background:var(--color-primary-light);}
  .product-icon{font-size:1.85rem;line-height:1;display:flex;align-items:center;justify-content:center;}
  .product-image-tile{
    width:3.1rem;height:3.1rem;border-radius:.8rem;object-fit:cover;display:block;
    background:#f4efe8;border:1.5px solid var(--color-border);box-shadow:inset 0 0 0 1px rgba(0,0,0,.02);
  }
  .product-emoji{font-size:1.85rem;line-height:1;display:block;}
  .product-name{font-size:.8rem;font-weight:700;line-height:1.2;min-height:2.1em;display:flex;align-items:center;}
  .product-price{font-size:.78rem;color:var(--color-text-muted);font-weight:700;}
  .qty-badge{
    position:absolute;top:-.45rem;right:-.45rem;background:var(--color-accent);color:#2b2110;font-weight:800;
    font-size:.78rem;min-width:1.5rem;height:1.5rem;border-radius:999px;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--color-bg);padding:0 .25rem;
  }
  .qty-minus-btn{
    position:absolute;bottom:.45rem;left:.45rem;width:1.55rem;height:1.55rem;border-radius:999px;background:#fff;
    border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center;color:var(--color-text);
  }
  .empty-note{color:var(--color-text-muted);font-size:.88rem;text-align:center;padding:1.5rem .5rem;}

  .cart-panel{background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow-sm);}
  .cart-panel h2{font-size:.98rem;margin:0 0 .7rem;}
  .cart-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--color-border);}
  .cart-item:last-child{border-bottom:none;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{font-weight:700;font-size:.85rem;}
  .cart-item-sub{font-size:.74rem;color:var(--color-text-muted);font-weight:600;}
  .qty-stepper{display:flex;align-items:center;gap:.35rem;flex:0 0 auto;}
  .stepper-btn{width:1.75rem;height:1.75rem;border-radius:999px;border:1.5px solid var(--color-border);background:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text);}
  .stepper-value{min-width:1.3rem;text-align:center;font-weight:800;font-size:.88rem;}
  .cart-item-remove{width:1.75rem;height:1.75rem;border-radius:999px;border:none;background:transparent;color:var(--color-danger);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .cart-subtotal-row{display:flex;justify-content:space-between;font-weight:800;padding-top:.65rem;margin-top:.2rem;border-top:1.5px dashed var(--color-border);font-size:.95rem;}
  .confirmed-list{margin-top:.9rem;padding-top:.85rem;border-top:1.5px solid var(--color-border);}
  .confirmed-list h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--color-text-muted);margin:0 0 .5rem;font-weight:800;}
  .confirmed-line{display:flex;justify-content:space-between;font-size:.82rem;padding:.22rem 0;font-weight:600;}
  .confirmed-line span:last-child{font-weight:800;}

  .mobile-send-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--color-text);color:#fff;padding:.8rem .9rem calc(.8rem + env(safe-area-inset-bottom, 0px));
    display:flex;align-items:center;justify-content:space-between;gap:.8rem;z-index:60;box-shadow:0 -4px 16px rgba(0,0,0,.18);
  }
  .mobile-send-bar .msb-info{font-size:.78rem;opacity:.85;font-weight:700;}
  .mobile-send-bar strong{display:block;font-size:1.05rem;}
  .mobile-send-bar .btn{white-space:nowrap;min-height:2.8rem;}
  @media(min-width:960px){.mobile-send-bar{display:none;}}

  /* ---------- admin ---------- */
  .admin-tabs{display:flex;gap:.5rem;margin-bottom:1rem;overflow-x:auto;}
  .admin-panel{background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:1rem;}
  .admin-panel h2{font-size:1rem;margin:0 0 .8rem;}
  .form-row{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:1rem;}
  .form-row input,.form-row select{
    flex:1 1 130px;padding:.7rem .8rem;border-radius:.75rem;border:1.5px solid var(--color-border);font-size:.87rem;background:var(--color-bg);min-height:2.9rem;
  }
  .form-row .btn{flex:0 0 auto;min-height:2.9rem;}
  .floating-add-btn{
    position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom, 0px));z-index:80;
    width:3.5rem;height:3.5rem;border-radius:50%;border:none;
    background:var(--color-primary);color:#fff;box-shadow:var(--shadow-md);
    font-size:2rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .quick-add-table{
    background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);
    padding:1rem;margin-bottom:1rem;box-shadow:var(--shadow-sm);
  }
  .quick-add-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;}
  .quick-add-table-header h3{margin:0;font-size:1rem;}
  .lock-panel{
    background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);
    padding:1.25rem;box-shadow:var(--shadow-sm);text-align:center;
  }
  .lock-panel .emoji{font-size:2rem;display:block;margin-bottom:.4rem;}
  .lock-panel h3{margin:0 0 .5rem;}
  .lock-panel p{margin:0 0 .9rem;color:var(--color-text-muted);font-size:.85rem;line-height:1.5;}
  .lock-panel .form-row{margin-bottom:0;}
  .admin-list-row{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--color-border);flex-wrap:wrap;}
  .admin-list-row:last-child{border-bottom:none;}
  .admin-row-main{flex:1;min-width:160px;}
  .admin-row-main strong{display:block;font-size:.9rem;}
  .admin-row-main small{color:var(--color-text-muted);font-weight:600;font-size:.76rem;}
  .admin-row-actions{display:flex;gap:.4rem;flex:0 0 auto;}
  .icon-small-btn{border:1.5px solid var(--color-border);background:#fff;border-radius:.6rem;width:2.15rem;height:2.15rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text);}
  .icon-small-btn.danger{color:var(--color-danger);border-color:var(--color-danger);}
  .icon-small-btn:disabled{opacity:.35;cursor:not-allowed;}
  .edit-row{display:flex;flex-wrap:wrap;gap:.5rem;width:100%;padding:.5rem 0;}
  .edit-row input,.edit-row select{flex:1 1 110px;padding:.5rem .7rem;border-radius:.55rem;border:1.5px solid var(--color-border);font-size:.85rem;}
  .category-group-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--color-text-muted);font-weight:800;margin:1rem 0 .3rem;}
  .category-group-title:first-child{margin-top:0;}

  .history-card{background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-md);padding:.85rem 1rem;margin-bottom:.65rem;}
  .history-card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem;}
  .history-card-top strong{font-size:.95rem;}
  .history-card-top span{font-weight:800;color:var(--color-primary-dark);}
  .history-card time{font-size:.74rem;color:var(--color-text-muted);font-weight:600;}
  .history-items{font-size:.8rem;color:var(--color-text-muted);margin-top:.35rem;line-height:1.5;}

  .empty-state{text-align:center;padding:2.4rem 1rem;color:var(--color-text-muted);}
  .empty-state .emoji{font-size:2.2rem;display:block;margin-bottom:.5rem;}
  .loading-state{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:.6rem;color:var(--color-text-muted);font-weight:800;}
  .loading-state::before{content:'';width:1rem;height:1rem;border:2px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"><div class="loading-state">Carregando dados...</div></div>
<div id="toast"></div>

<script>
/* =========================================================================
   MENININHO · SISTEMA DE GESTÃO DE MESAS
   Arquivo único (HTML + CSS + JS) — protótipo funcional.

   Organização do JavaScript:
     1. UTILITÁRIOS
     2. ÍCONES (SVG inline)
     3. DADOS INICIAIS (seed)
     4. CAMADA DE BANCO DE DADOS (Database) — hoje localStorage,
        preparada para futura troca por Firebase/Supabase em tempo real.
     5. ESTADO DA APLICAÇÃO (cache local + UI state)
     6. REGRAS DE NEGÓCIO (actions que chamam o Database)
     7. RENDERIZAÇÃO (views)
     8. EVENTOS (delegação de eventos)
     9. INICIALIZAÇÃO
   ========================================================================= */

/* ============================== 1. UTILITÁRIOS ========================== */
const Utils = {
  formatCurrency(value){
    return 'R$ ' + (Number(value)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  },
  pad2(n){ return String(n).padStart(2,'0'); },
  uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); },
  isSameDay(iso, ref){
    if(!iso) return false;
    const a = new Date(iso), b = ref || new Date();
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  },
  formatDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  },
  formatTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  },
  clamp(n,min,max){ return Math.min(Math.max(n,min),max); },
  escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
};

/*
  Abstração de persistência. Toda a aplicação fala apenas com "Database",
  nunca diretamente com o Firestore. Isso é o que permitiu trocar o motor
  de localStorage (protótipo) para Firebase/Firestore (tempo real de
  verdade) sem alterar UMA LINHA sequer de State, Actions, Render ou
  Eventos — só esta seção mudou.

  Cada coleção do Firestore tem um listener onSnapshot() que mantém um
  cache local sempre atualizado e dispara notify() sempre que os dados
  mudam — seja porque este próprio aparelho escreveu algo, seja porque
  outro garçom/caixa escreveu em outro dispositivo. É isso que resolve o
  requisito de "vários aparelhos ao mesmo tempo".
*/

function readLocalList(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : fallback;
  }catch(err){
    console.warn('LocalStorage leitura falhou:', key, err);
    return fallback;
  }
}

function writeLocalList(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(err){ console.warn('LocalStorage gravação falhou:', key, err); }
}

function firebaseWithTimeout(operation, timeoutMs = 10000){
  return Promise.race([
    operation(),
    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout de conexão com o Firebase')), timeoutMs))
  ]);
}

const Database = (function(){
  const listeners = [];
  const cache = {tables:[], products:[], history:[]};
  const ready = {tables:false, products:false, history:false};
  const healthy = {tables:false, products:false, history:false};
  const statusListeners = [];
  let fallbackMode = false;

  function setFallbackMode(value){
    if(fallbackMode === value) return;
    fallbackMode = value;
    statusListeners.forEach(fn => { try{ fn(fallbackMode); }catch(e){ console.error(e); } });
    if(value){
      cache.tables = readLocalList(STORAGE_KEYS.tables, []);
      cache.products = readLocalList(STORAGE_KEYS.products, []);
      cache.history = readLocalList(STORAGE_KEYS.history, []);
      ready.tables = true; ready.products = true; ready.history = true;
      notify();
    }
  }

  function isReady(){ return ready.tables && ready.products && ready.history; }

  function notify(){
    if(!isReady()) return; // evita renderizar telas parciais antes da primeira carga
    listeners.forEach(fn => { try{ fn(); }catch(e){ console.error(e); } });
  }

  function itemsTotal(items){
    return (items||[]).reduce((sum,i)=> sum + (i.unitPrice*i.quantity), 0);
  }

  function findTable(tableId){
    const t = cache.tables.find(t=>t.id===tableId);
    if(!t) throw new Error('Mesa não encontrada: '+tableId);
    return t;
  }
  function findProduct(productId){
    const p = cache.products.find(p=>p.id===productId);
    if(!p) throw new Error('Produto não encontrado');
    return p;
  }

  const tablesRef = firestore.collection('tables');
  const productsRef = firestore.collection('products');
  const historyRef = firestore.collection('history');

  function markHealthy(collection){
    healthy[collection] = true;
    if(healthy.tables && healthy.products && healthy.history) setFallbackMode(false);
  }

  function tableSnapshotData(snapshot){
    const d = snapshot.data();
    return {id:snapshot.id, number:d.number, status:d.status, openedAt:d.openedAt||null, orderItems:d.orderItems||[], draft:d.draft||[], cancelledItems:d.cancelledItems||[]};
  }

  function onSnapshotError(label){
    return (err) => {
      console.error('Erro ao ouvir "'+label+'":', err);
      const collection = label === 'mesas' ? 'tables' : (label === 'produtos' ? 'products' : 'history');
      healthy[collection] = false;
      setFallbackMode(true);
      showToast('Fallback local ativado (' + label + ')');
    };
  }

  function ensureLocalSeed(){
    const localProducts = readLocalList(STORAGE_KEYS.products, []);
    const activeLocalProducts = localProducts.filter(product => !REMOVED_PRODUCT_NAMES.has(String(product.name || '').trim().toLowerCase()));
    if(activeLocalProducts.length !== localProducts.length){
      writeLocalList(STORAGE_KEYS.products, activeLocalProducts);
    }
    if(!activeLocalProducts.length){
      writeLocalList(STORAGE_KEYS.products, buildSeedProducts().map((p, idx) => ({id: String(idx + 1), ...p})));
    }
    if(!readLocalList(STORAGE_KEYS.tables, []).length){
      const seedTables = Array.from({length:12}, (_, i) => ({
        id: String(i + 1),
        number: i + 1,
        status: 'free',
        openedAt: null,
        orderItems: [],
        draft: []
      }));
      writeLocalList(STORAGE_KEYS.tables, seedTables);
    }
    if(!readLocalList(STORAGE_KEYS.history, []).length){
      writeLocalList(STORAGE_KEYS.history, []);
    }
  }

  async function localAddTable(number){
    const tables = readLocalList(STORAGE_KEYS.tables, []);
    if(!Number.isFinite(Number(number))){
      const used = tables.map(t => Number(t.number)).filter(Number.isFinite).sort((a,b)=>a-b);
      number = 1;
      for(const current of used){ if(current === number) number += 1; else if(current > number) break; }
    }
    const nextId = String(Date.now()) + '-' + Math.random().toString(16).slice(2, 8);
    tables.push({id: nextId, number, status:'free', openedAt:null, orderItems:[], draft:[]});
    writeLocalList(STORAGE_KEYS.tables, tables.sort((a,b)=>a.number-b.number));
    cache.tables = tables.slice();
    ready.tables = true;
    notify();
    return number;
  }

  async function localRemoveTable(tableId){
    const tables = readLocalList(STORAGE_KEYS.tables, []).filter(t => t.id !== tableId);
    writeLocalList(STORAGE_KEYS.tables, tables);
    cache.tables = tables.slice();
    ready.tables = true;
    notify();
  }

  async function localUpdateTable(tableId, patch){
    const tables = readLocalList(STORAGE_KEYS.tables, []).map(t => t.id === tableId ? {...t, ...patch} : t);
    writeLocalList(STORAGE_KEYS.tables, tables);
    cache.tables = tables.slice();
    ready.tables = true;
    notify();
  }

  async function localAddProduct(payload){
    const products = readLocalList(STORAGE_KEYS.products, []);
    const item = {
      id: String(Date.now()) + '-' + Math.random().toString(16).slice(2, 8),
      name: payload.name,
      category: payload.category,
      price: Number(payload.price) || 0,
      icon: payload.icon || DEFAULT_ICON_BY_CATEGORY[payload.category] || '🍽️'
    };
    products.push(item);
    writeLocalList(STORAGE_KEYS.products, products);
    cache.products = products.slice();
    ready.products = true;
    notify();
  }

  async function localUpdateProduct(productId, patch){
    const products = readLocalList(STORAGE_KEYS.products, []).map(p => p.id === productId ? {...p, ...patch} : p);
    writeLocalList(STORAGE_KEYS.products, products);
    cache.products = products.slice();
    ready.products = true;
    notify();
  }

  async function localRemoveProduct(productId){
    const products = readLocalList(STORAGE_KEYS.products, []).filter(p => p.id !== productId);
    writeLocalList(STORAGE_KEYS.products, products);
    cache.products = products.slice();
    ready.products = true;
    notify();
  }

  function localSyncAll(){
    const tables = readLocalList(STORAGE_KEYS.tables, []);
    const products = readLocalList(STORAGE_KEYS.products, []);
    const history = readLocalList(STORAGE_KEYS.history, []);
    cache.tables = tables;
    cache.products = products;
    cache.history = history;
    ready.tables = true; ready.products = true; ready.history = true;
  }

  tablesRef.onSnapshot(snap => {
    cache.tables = snap.docs
      .map(doc => { const d=doc.data(); return {id:doc.id, number:d.number, status:d.status, openedAt:d.openedAt||null, orderItems:d.orderItems||[], draft:d.draft||[], cancelledItems:d.cancelledItems||[]}; })
      .sort((a,b)=> a.number-b.number);
    writeLocalList(STORAGE_KEYS.tables, cache.tables);
    markHealthy('tables');
    ready.tables = true; notify();
  }, onSnapshotError('mesas'));

  productsRef.onSnapshot(snap => {
    cache.products = snap.docs.map(doc => { const d=doc.data(); return {id:doc.id, name:d.name, category:d.category, price:d.price, icon:d.icon}; });
    writeLocalList(STORAGE_KEYS.products, cache.products);
    markHealthy('products');
    ready.products = true; notify();
  }, onSnapshotError('produtos'));

  historyRef.onSnapshot(snap => {
    cache.history = snap.docs
      .map(doc => { const d=doc.data(); return {id:doc.id, tableNumber:d.tableNumber, closedAt:d.closedAt, total:d.total, items:d.items||[]}; })
      .sort((a,b)=> new Date(b.closedAt)-new Date(a.closedAt));
    writeLocalList(STORAGE_KEYS.history, cache.history);
    markHealthy('history');
    ready.history = true; notify();
  }, onSnapshotError('histórico'));

  // Semeia o cardápio e as 12 mesas na primeira vez que o banco é usado
  // (coleções vazias). Não roda de novo depois disso.
  async function ensureSeed(){
    try{
      const [pSnap, tSnap] = await Promise.all([
        firebaseWithTimeout(() => productsRef.limit(1).get()),
        firebaseWithTimeout(() => tablesRef.limit(1).get())
      ]);
      if(pSnap.empty){
        const batch = firestore.batch();
        const localProducts = readLocalList(STORAGE_KEYS.products, []);
        const productsToSeed = localProducts.length ? localProducts : buildSeedProducts();
        productsToSeed.forEach(p => {
          const ref = p.id ? productsRef.doc(String(p.id)) : productsRef.doc();
          const {id, ...product} = p;
          batch.set(ref, product);
        });
        await firebaseWithTimeout(() => batch.commit());
      }
      const catalogSnap = await firebaseWithTimeout(() => productsRef.get());
      const existingProductNames = new Set(catalogSnap.docs.map(doc => String(doc.data().name || '').trim().toLowerCase()));
      const missingProducts = buildSeedProducts().filter(product => !existingProductNames.has(product.name.toLowerCase()));
      const removedProductDocs = catalogSnap.docs.filter(doc => REMOVED_PRODUCT_NAMES.has(String(doc.data().name || '').trim().toLowerCase()));
      if(missingProducts.length || removedProductDocs.length){
        const batch = firestore.batch();
        missingProducts.forEach(product => batch.set(productsRef.doc(), product));
        removedProductDocs.forEach(doc => batch.delete(doc.ref));
        await firebaseWithTimeout(() => batch.commit());
      }
      if(tSnap.empty){
        const batch = firestore.batch();
        for(let n=1; n<=12; n++){ batch.set(tablesRef.doc(), {number:n, status:'free', openedAt:null, orderItems:[], draft:[]}); }
        await firebaseWithTimeout(() => batch.commit());
      }
    }catch(err){
      console.error('Falha ao semear dados iniciais', err);
      setFallbackMode(true);
      ensureLocalSeed();
      showToast('Fallback local ativado');
    }
  }
  ensureSeed();

  ensureLocalSeed();
  localSyncAll();

  return {
    // ---- assinatura de mudanças em tempo real (onSnapshot) ----
    subscribe(fn){
      listeners.push(fn);
      if(isReady()) fn(); // já havia dados: entrega o estado atual imediatamente
      return () => { const i=listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
    },
    subscribeStatus(fn){
      statusListeners.push(fn);
      fn(fallbackMode);
      return () => { const i=statusListeners.indexOf(fn); if(i>=0) statusListeners.splice(i,1); };
    },
    isOffline(){ return fallbackMode; },
    isReady,

    // ---- leitura (a partir do cache mantido pelo onSnapshot) ----
    async getTables(){ return JSON.parse(JSON.stringify(cache.tables)); },
    async getTable(tableId){ return JSON.parse(JSON.stringify(findTable(tableId))); },
    async getProducts(){ return JSON.parse(JSON.stringify(cache.products)); },
    async getHistory(){ return JSON.parse(JSON.stringify(cache.history)); },

    // ---- pedido / carrinho ----
    async addDraftItem(tableId, productId){
      const product = findProduct(productId);
      if(fallbackMode){
        const t = findTable(tableId);
        const draft = t.draft.map(i=>({...i}));
        const existing = draft.find(i=>i.productId===productId);
        if(existing) existing.quantity += 1;
        else draft.push({productId, name:product.name, unitPrice:product.price, quantity:1});
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? {...table, draft} : table);
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const snapshot = await transaction.get(tablesRef.doc(tableId));
        const t = tableSnapshotData(snapshot);
        const draft = t.draft.map(i=>({...i}));
        const existing = draft.find(i=>i.productId===productId);
        if(existing) existing.quantity += 1;
        else draft.push({productId, name:product.name, unitPrice:product.price, quantity:1});
        transaction.update(tablesRef.doc(tableId), {draft});
      });
    },
    async setDraftQty(tableId, productId, qty){
      qty = Math.max(0, Math.floor(qty));
      if(fallbackMode){
        const t = findTable(tableId);
        let draft = t.draft.map(i=>({...i}));
        if(qty === 0) draft = draft.filter(i=>i.productId!==productId);
        else { const existing = draft.find(i=>i.productId===productId); if(existing) existing.quantity = qty; }
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? {...table, draft} : table);
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const snapshot = await transaction.get(ref);
        const draft = tableSnapshotData(snapshot).draft.map(i=>({...i}));
        if(qty === 0) {
          transaction.update(ref, {draft:draft.filter(i=>i.productId!==productId)});
        } else {
          const existing = draft.find(i=>i.productId===productId);
          if(existing) existing.quantity = qty;
          transaction.update(ref, {draft});
        }
      });
    },
    async removeDraftItem(tableId, productId){
      if(fallbackMode){
        const t = findTable(tableId);
        const draft = t.draft.filter(i=>i.productId!==productId);
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? {...table, draft} : table);
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const snapshot = await transaction.get(ref);
        const draft = tableSnapshotData(snapshot).draft.filter(i=>i.productId!==productId);
        transaction.update(ref, {draft});
      });
    },
    async sendOrder(tableId){
      if(fallbackMode){
        const t = findTable(tableId);
        if(!t.draft.length) return;
        const orderItems = t.orderItems.map(i=>({...i}));
        t.draft.forEach(di => { const existing = orderItems.find(i=>i.productId===di.productId); if(existing) existing.quantity += di.quantity; else orderItems.push({...di}); });
        const patch = {orderItems, draft:[]};
        if(t.status === 'free'){ patch.status = 'occupied'; patch.openedAt = new Date().toISOString(); }
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? {...table, ...patch} : table);
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const t = tableSnapshotData(await transaction.get(ref));
        if(!t.draft.length) return;
        const orderItems = t.orderItems.map(i=>({...i}));
        t.draft.forEach(di => { const existing = orderItems.find(i=>i.productId===di.productId); if(existing) existing.quantity += di.quantity; else orderItems.push({...di}); });
        const patch = {orderItems, draft:[]};
        if(t.status === 'free'){ patch.status = 'occupied'; patch.openedAt = new Date().toISOString(); }
        transaction.update(ref, patch);
      });
    },
    async requestBill(tableId){
      if(fallbackMode){
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? {...table, status:'billing'} : table);
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const t = tableSnapshotData(await transaction.get(ref));
        if(t.status === 'occupied') transaction.update(ref, {status:'billing'});
      });
    },
    async reopenTable(tableId){
      if(fallbackMode){ await localUpdateTable(tableId, {status:'occupied'}); return; }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const t = tableSnapshotData(await transaction.get(ref));
        if(t.status === 'billing') transaction.update(ref, {status:'occupied'});
      });
    },
    async updateConfirmedItem(tableId, productId, qty, reason=''){
      qty = Math.max(0, Math.floor(qty));
      if(fallbackMode){
        const t = findTable(tableId);
        let orderItems = t.orderItems.map(i=>({...i}));
        const cancelledItems = (t.cancelledItems||[]).map(i=>({...i}));
        if(qty === 0) orderItems = orderItems.filter(i=>i.productId!==productId);
        else { const item = orderItems.find(i=>i.productId===productId); if(item) item.quantity = qty; }
        if(qty === 0 && reason) cancelledItems.push({productId, reason:reason.trim(), cancelledAt:new Date().toISOString()});
        await localUpdateTable(tableId, {orderItems, cancelledItems});
        return;
      }
      await firestore.runTransaction(async transaction => {
        const ref = tablesRef.doc(tableId);
        const current = tableSnapshotData(await transaction.get(ref));
        const orderItems = current.orderItems.map(i=>({...i}));
        const patch = {orderItems:qty === 0 ? orderItems.filter(i=>i.productId!==productId) : orderItems};
        if(qty > 0){ const item = patch.orderItems.find(i=>i.productId===productId); if(item) item.quantity = qty; }
        if(qty === 0 && reason) patch.cancelledItems = [...current.cancelledItems, {productId, reason:reason.trim(), cancelledAt:new Date().toISOString()}];
        transaction.update(ref, patch);
      });
    },
    async closeTable(tableId){
      const t = findTable(tableId);
      const total = itemsTotal(t.orderItems);
      if(fallbackMode){
        const history = readLocalList(STORAGE_KEYS.history, []);
        const tables = readLocalList(STORAGE_KEYS.tables, []).map(table => table.id === tableId ? { ...table, status:'free', openedAt:null, orderItems:[], draft:[] } : table);
        if(total > 0){
          history.unshift({id: String(Date.now()), tableNumber: t.number, closedAt: new Date().toISOString(), total, items: t.orderItems});
          writeLocalList(STORAGE_KEYS.history, history);
          cache.history = history.slice();
        }
        writeLocalList(STORAGE_KEYS.tables, tables);
        cache.tables = tables.slice();
        ready.tables = true; ready.history = true; notify();
        return;
      }
      await firestore.runTransaction(async transaction => {
        const tableRef = tablesRef.doc(tableId);
        const current = tableSnapshotData(await transaction.get(tableRef));
        const currentTotal = itemsTotal(current.orderItems);
        if(currentTotal > 0){
          transaction.set(historyRef.doc(), {tableNumber:current.number, closedAt:new Date().toISOString(), total:currentTotal, items:current.orderItems});
        }
        transaction.update(tableRef, {status:'free', openedAt:null, orderItems:[], draft:[]});
      });
    },

    // ---- administração: mesas ----
    async addTable(number){
      if(fallbackMode){
        return await localAddTable(number);
      }
      try{
        return await firebaseWithTimeout(() => firestore.runTransaction(async transaction => {
          const snapshot = await transaction.get(tablesRef);
          const used = snapshot.docs.map(doc => Number(doc.data().number)).filter(Number.isFinite).sort((a,b)=>a-b);
          let next = 1;
          for(const current of used){ if(current === next) next += 1; else if(current > next) break; }
          const ref = tablesRef.doc();
          transaction.set(ref, {number:next, status:'free', openedAt:null, orderItems:[], draft:[]});
          return next;
        }));
      }catch(err){
        console.warn('Firestore addTable falhou; usando localStorage.', err);
        setFallbackMode(true);
        return await localAddTable(number);
      }
    },
    async updateTable(tableId, patch){
      if(fallbackMode){
        await localUpdateTable(tableId, patch);
        return;
      }
      try{ await firebaseWithTimeout(() => tablesRef.doc(tableId).update(patch)); }
      catch(err){
        console.warn('Firestore updateTable falhou; usando localStorage.', err);
        setFallbackMode(true);
        await localUpdateTable(tableId, patch);
      }
    },
    async removeTable(tableId){
      const t = findTable(tableId);
      if(t.status !== 'free') throw new Error('Só é possível remover mesas livres.');
      if(fallbackMode){
        await localRemoveTable(tableId);
        return;
      }
      try{ await firebaseWithTimeout(() => tablesRef.doc(tableId).delete()); }
      catch(err){
        console.warn('Firestore removeTable falhou; usando localStorage.', err);
        setFallbackMode(true);
        await localRemoveTable(tableId);
      }
    },

    // ---- administração: produtos ----
    async addProduct(payload){
      if(fallbackMode){
        await localAddProduct(payload);
        return;
      }
      try{
        await firebaseWithTimeout(() => productsRef.add({
          name:payload.name, category:payload.category,
          price:Number(payload.price)||0, icon: payload.icon || DEFAULT_ICON_BY_CATEGORY[payload.category] || '🍽️'
        }));
      }catch(err){
        console.warn('Firestore addProduct falhou; usando localStorage.', err);
        setFallbackMode(true);
        await localAddProduct(payload);
      }
    },
    async updateProduct(productId, patch){
      if(fallbackMode){
        await localUpdateProduct(productId, patch);
        return;
      }
      try{ await firebaseWithTimeout(() => productsRef.doc(productId).update(patch)); }
      catch(err){
        console.warn('Firestore updateProduct falhou; usando localStorage.', err);
        setFallbackMode(true);
        await localUpdateProduct(productId, patch);
      }
    },
    async removeProduct(productId){
      if(fallbackMode){
        await localRemoveProduct(productId);
        return;
      }
      try{ await firebaseWithTimeout(() => productsRef.doc(productId).delete()); }
      catch(err){
        console.warn('Firestore removeProduct falhou; usando localStorage.', err);
        setFallbackMode(true);
        await localRemoveProduct(productId);
      }
    },

    // ---- utilidades internas ----
    _itemsTotal: itemsTotal
  };
})();

const State = {

  currentTableId:null,
  checkoutTableId:null,
  tableStatusFilter:'all',     // all | free | occupied | billing
  productSearch:'',
  productCategory:'all',
  adminTab:'mesas',            // mesas | produtos | historico
  editingProductId:null,
  showAddTableForm:false,
  productAccessUnlocked:false,
  productPasswordInput:'',

  // valores "em digitação" nos formulários de administração — guardados aqui
  // (e não só no DOM) para não serem perdidos quando um re-render é disparado
  // por uma mudança vinda de OUTRO aparelho enquanto alguém está editando.
  addProductDraft:{icon:'', name:'', category:'espetinhos', price:''},
  editProductDraft:{icon:'', name:'', category:'espetinhos', price:''},

  // cache local, mantido em sincronia pelo Database.subscribe
  tables:[], products:[], history:[]
};

async function refreshCache(){
  State.tables = await Database.getTables();
  State.products = await Database.getProducts();
  State.history = await Database.getHistory();
}

/* ========================= 6. REGRAS DE NEGÓCIO ========================== */
function calcItemsTotal(items){ return (items||[]).reduce((s,i)=> s + i.unitPrice*i.quantity, 0); }

function getTableGrandTotal(table){
  return calcItemsTotal(table.orderItems) + calcItemsTotal(table.draft);
}

function getDashboardStats(){
  const free = State.tables.filter(t=>t.status==='free').length;
  const occupied = State.tables.filter(t=>t.status==='occupied').length;
  const billing = State.tables.filter(t=>t.status==='billing').length;
  const todayEntries = State.history.filter(h=>Utils.isSameDay(h.closedAt));
  const revenueToday = todayEntries.reduce((s,h)=> s + h.total, 0);
  const ordersToday = todayEntries.length;
  const avgTicket = ordersToday ? revenueToday/ordersToday : 0;
  return {free, occupied, billing, revenueToday, ordersToday, avgTicket};
}

const Actions = {
  async goToDashboard(){ State.view='dashboard'; State.currentTableId=null; State.checkoutTableId=null; render(); },
  async openTable(tableId){ State.view='table'; State.currentTableId=tableId; State.checkoutTableId=null; State.productSearch=''; State.productCategory='all'; render(); },
  async openAdmin(){ State.view='admin'; render(); },
  async openCheckout(tableId){ State.view='checkout'; State.currentTableId=tableId; State.checkoutTableId=tableId; render(); },

  async addToCart(tableId, productId){
    await Database.addDraftItem(tableId, productId);
  },
  async decFromCart(tableId, productId, currentQty){
    await Database.setDraftQty(tableId, productId, currentQty - 1);
  },
  async setCartQty(tableId, productId, qty){
    await Database.setDraftQty(tableId, productId, qty);
  },
  async removeFromCart(tableId, productId){
    await Database.removeDraftItem(tableId, productId);
  },
  async sendOrder(tableId){
    await Database.sendOrder(tableId);
    showToast('Pedido enviado ✓');
  },
  async requestBill(tableId){
    await Database.requestBill(tableId);
    showToast('Conta solicitada');
  },
  async finalizeTable(tableId, total, number){
    await Database.closeTable(tableId);
    showToast('Mesa liberada ✓');
    Actions.goToDashboard();
  }
};

/* =============================== TOAST =================================== */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ============================ 7. RENDERIZAÇÃO ============================ */
function render(){
  // preserva foco/cursor de um eventual input em edição durante o re-render
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const app = document.getElementById('app');
  app.innerHTML = renderTopbar() + '<main class="view">' + renderCurrentView() + '</main>';

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ---------------------------- DASHBOARD ---------------------------- */
function renderDashboardView(){
  const stats = getDashboardStats();
  const filters = [
    {id:'all', label:'Todas'},
    {id:'free', label:'Livres'},
    {id:'occupied', label:'Ocupadas'},
    {id:'billing', label:'Conta pedida'}
  ];
  const filtered = State.tables
    .filter(t => State.tableStatusFilter==='all' || t.status===State.tableStatusFilter)
    .sort((a,b)=> a.number-b.number);

  return `
    <section class="stats-grid">
      ${statCard(stats.free, 'Mesas livres')}
      ${statCard(stats.occupied, 'Mesas ocupadas')}
      ${statCard(stats.billing, 'Contas solicitadas')}
    </section>

    <div class="chip-row">
      ${filters.map(f=>`<button class="chip ${State.tableStatusFilter===f.id?'active':''}" data-set-table-filter="${f.id}">${f.label}</button>`).join('')}
    </div>

    ${filtered.length ? `<section class="tables-grid">${filtered.map(renderTableCard).join('')}</section>` :
      `<div class="empty-state"><span class="emoji">🪑</span>Nenhuma mesa encontrada para este filtro.</div>`}
  `;
}

function statCard(value, label, highlight){
  return `<div class="stat-card ${highlight?'highlight':''}">
    <div class="stat-value">${value}</div>
    <div class="stat-label">${label}</div>
  </div>`;
}

const STATUS_LABEL = {free:'Livre', occupied:'Ocupada', billing:'Conta solicitada'};

function renderTableCard(table){
  const total = getTableGrandTotal(table);
  const itemCount = (table.orderItems||[]).reduce((s,i)=>s+i.quantity,0) + (table.draft||[]).reduce((s,i)=>s+i.quantity,0);
  return `
    <button class="table-card status-${table.status}" data-open-table="${table.id}">
      <div class="table-card-top">
        <span class="table-number">Mesa ${Utils.pad2(table.number)}</span>
        <span class="status-dot"></span>
      </div>
      <div class="table-status-label">${STATUS_LABEL[table.status]}</div>
      <div class="table-total">${Utils.formatCurrency(total)}</div>
      ${itemCount ? `<div class="table-meta">${itemCount} ${itemCount===1?'item':'itens'}</div>` : ''}
    </button>`;
}

/* ---------------------------- TELA DA MESA ---------------------------- */
function renderTableView(){
  const table = State.tables.find(t=>t.id===State.currentTableId);
  if(!table){ State.view='dashboard'; return renderDashboardView(); }

  const grandTotal = getTableGrandTotal(table);
  const badgeClass = table.status==='free' ? 'st-free' : (table.status==='billing' ? 'st-billing' : '');

  let actionsHtml = '';
  if(table.status === 'occupied'){
    actionsHtml = `<button class="btn btn-accent" data-request-bill="${table.id}" ${calcItemsTotal(table.orderItems)<=0?'disabled':''}>Solicitar conta</button>`;
  } else if(table.status === 'billing'){
    actionsHtml = `<button class="btn btn-primary" data-finalize="${table.id}" data-total="${grandTotal}" data-number="${table.number}">Finalizar conta</button>
      <button class="btn btn-outline" data-reopen-table="${table.id}">Voltar para ocupada</button>`;
  }

  return `
    <div class="table-header">
      <button class="iconbtn" data-nav="dashboard" aria-label="Voltar">${Icons.back}</button>
      <div>
        <h1>Mesa ${Utils.pad2(table.number)}</h1>
        <span class="status-badge ${badgeClass}">${STATUS_LABEL[table.status]}</span>
      </div>
    </div>

    <div class="table-total-banner">
      <span>Total da mesa</span>
      <strong>${Utils.formatCurrency(grandTotal)}</strong>
    </div>

    ${actionsHtml ? `<div class="table-actions">${actionsHtml}</div>` : ''}

    <div class="table-body">
      <div class="menu-panel">
        ${renderMenuSearch()}
        ${renderMenuGrid(table)}
      </div>
      <aside class="cart-panel" id="cart-panel">
        ${renderCartPanel(table)}
      </aside>
    </div>

    ${renderMobileSendBar(table)}
  `;
}

function renderMenuSearch(){
  const cats = [{id:'all', label:'Todas'}, ...CATEGORIES];
  return `
    <div class="search-input-wrap">
      ${Icons.search}
      <input type="text" id="product-search-input" placeholder="Buscar produto no cardápio..." value="${Utils.escapeHtml(State.productSearch)}">
    </div>
    <div class="chip-row">
      ${cats.map(c=>`<button class="chip ${State.productCategory===c.id?'active':''}" data-set-category="${c.id}">${c.label}</button>`).join('')}
    </div>
  `;
}

function renderMenuGrid(table){
  const term = State.productSearch.trim().toLowerCase();
  let products = State.products.filter(p =>
    (State.productCategory==='all' || p.category===State.productCategory) &&
    (!term || p.name.toLowerCase().includes(term))
  );

  if(!products.length){
    return `<div class="empty-note">Nenhum produto encontrado.</div>`;
  }

  const draftMap = {};
  (table.draft||[]).forEach(i => draftMap[i.productId] = i.quantity);

  // agrupa por categoria apenas quando não há busca/filtro específico de texto,
  // para facilitar a navegação visual do garçom
  if(State.productCategory !== 'all' || term){
    return `<div class="menu-grid">${products.map(p=>renderProductCard(p, draftMap[p.id]||0)).join('')}</div>`;
  }

  return CATEGORIES.map(cat => {
    const items = products.filter(p=>p.category===cat.id);
    if(!items.length) return '';
    return `<div class="menu-section-title">${cat.label}</div>
      <div class="menu-grid">${items.map(p=>renderProductCard(p, draftMap[p.id]||0)).join('')}</div>`;
  }).join('');
}

function renderProductIcon(iconValue, productName){
  const value = String(iconValue || '').trim();
  const displayValue = value;
  if(!displayValue) return '<span class="product-emoji">🍽️</span>';
  const isImagePath = /^(https?:\/\/|data:image\/|\.\.?\/|\/)/i.test(displayValue) || /\.(avif|gif|jpe?g|png|webp)(\?.*)?$/i.test(displayValue);
  if(isImagePath){
    return `<img class="product-image-tile" src="${Utils.escapeHtml(displayValue)}" alt="Imagem do produto" loading="lazy">`;
  }
  return `<span class="product-emoji">${Utils.escapeHtml(displayValue)}</span>`;
}

function renderProductCard(product, qty){
  return `
    <div class="product-card ${qty>0?'has-qty':''}" data-add-product="${product.id}">
      ${qty>0 ? `<button class="qty-minus-btn" data-dec-product="${product.id}" data-qty="${qty}" aria-label="Remover uma unidade">${Icons.minus}</button>` : ''}
      ${qty>0 ? `<span class="qty-badge">${qty}</span>` : ''}
      <div class="product-icon">${renderProductIcon(product.icon, product.name)}</div>
      <div class="product-name">${Utils.escapeHtml(product.name)}</div>
      <div class="product-price">${Utils.formatCurrency(product.price)}</div>
    </div>`;
}

function renderCartPanel(table){
  const draft = table.draft || [];
  const confirmed = table.orderItems || [];
  const draftTotal = calcItemsTotal(draft);
  const confirmedTotal = calcItemsTotal(confirmed);

  let html = `<h2>Pedido</h2>`;

  if(!draft.length){
    html += `<div class="cart-empty">Toque em um produto do cardápio para começar a montar o pedido.</div>`;
  } else {
    html += draft.map(item => `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${Utils.escapeHtml(item.name)}</div>
          <div class="cart-item-sub">${Utils.formatCurrency(item.unitPrice)} un.</div>
        </div>
        <div class="qty-stepper">
          <button class="stepper-btn" data-cart-dec="${item.productId}" data-qty="${item.quantity}">${Icons.minus}</button>
          <span class="stepper-value">${item.quantity}</span>
          <button class="stepper-btn" data-cart-inc="${item.productId}">${Icons.plus}</button>
        </div>
        <button class="cart-item-remove" data-cart-remove="${item.productId}" aria-label="Remover item">${Icons.trash}</button>
      </div>
    `).join('');
    html += `<div class="cart-subtotal-row"><span>Novo pedido</span><span>${Utils.formatCurrency(draftTotal)}</span></div>
      <button class="btn btn-primary btn-block" style="margin-top:.8rem;" data-send-order="${table.id}">Enviar pedido</button>`;
  }

  if(confirmed.length){
    html += `<div class="confirmed-list">
      <h3>Já registrado nesta mesa</h3>
      ${confirmed.map(item => `<div class="confirmed-line"><span>${item.quantity}x ${Utils.escapeHtml(item.name)}</span><span>${Utils.formatCurrency(item.unitPrice*item.quantity)} ${State.productAccessUnlocked ? `<button class="stepper-btn" data-confirmed-dec="${item.productId}" data-qty="${item.quantity}" aria-label="Diminuir item confirmado">${Icons.minus}</button><button class="stepper-btn" data-confirmed-inc="${item.productId}" data-qty="${item.quantity}" aria-label="Aumentar item confirmado">${Icons.plus}</button><button class="cart-item-remove" data-confirmed-remove="${item.productId}" aria-label="Remover item confirmado">${Icons.trash}</button>` : ''}</span></div>`).join('')}
      <div class="confirmed-line" style="border-top:1px dashed var(--color-border);padding-top:.4rem;margin-top:.3rem;"><span>Total registrado</span><span>${Utils.formatCurrency(confirmedTotal)}</span></div>
    </div>`;
  }

  return html;
}

function renderMobileSendBar(table){
  const draft = table.draft || [];
  if(!draft.length) return '';
  const total = calcItemsTotal(draft);
  const count = draft.reduce((s,i)=>s+i.quantity,0);
  return `
    <div class="mobile-send-bar">
      <div class="msb-info">${count} ${count===1?'item novo':'itens novos'}<strong>${Utils.formatCurrency(total)}</strong></div>
      <button class="btn btn-accent" data-send-order="${table.id}">Enviar pedido</button>
    </div>`;
}

      <button class="iconbtn" data-nav="dashboard" aria-label="Voltar">${Icons.back}</button>
      <div><h1>Administração</h1></div>
    </div>
    <div class="admin-tabs">
      ${tabs.map(t=>`<button class="chip ${State.adminTab===t.id?'active':''}" data-set-admin-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    ${body}
  `;
}

function getNextTableNumber(){
  const used = [...State.tables].map(t => Number(t.number)).filter(Number.isFinite).sort((a,b)=>a-b);
  let next = 1;
  for(const n of used){
    if(n === next) next += 1;
    else if(n > next) break;
  }
  return next;
}

function renderQuickAddTableForm(){
  if(!State.showAddTableForm) return '';
  return `
    <div class="quick-add-table">

        <h3>Nova mesa</h3>

      <form class="form-row" id="form-add-table">

  const groups = CATEGORIES.map(cat => {
    const items = State.products.filter(p=>p.category===cat.id);
    if(!items.length) return '';
    const rows = items.map(p => {
      if(State.editingProductId === p.id){
        return `<div class="admin-list-row">
          <div class="edit-row">
            <div class="product-icon" style="flex:0 0 48px;">${renderProductIcon(State.editProductDraft.icon)}</div>
            <input type="text" id="edit-prod-icon" value="${Utils.escapeHtml(State.editProductDraft.icon)}" placeholder="Emoji ou URL" style="flex:0 0 110px;text-align:center;">
            <input type="text" id="edit-prod-name" value="${Utils.escapeHtml(State.editProductDraft.name)}" placeholder="Nome">
            <select id="edit-prod-category">${CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===State.editProductDraft.category?'selected':''}>${c.label}</option>`).join('')}</select>
            <input type="number" step="0.01" min="0" id="edit-prod-price" value="${State.editProductDraft.price}" placeholder="Preço">
            <button class="icon-small-btn" data-save-product="${p.id}" aria-label="Salvar">${Icons.check}</button>

        </div>`;
      }
      return `<div class="admin-list-row">
        <div class="admin-row-main">
          <strong>${renderProductIcon(p.icon, p.name)} ${Utils.escapeHtml(p.name)}</strong>
          <small>${Utils.formatCurrency(p.price)}</small>
        </div>
        <div class="admin-row-actions">
          <button class="icon-small-btn" data-edit-product="${p.id}" aria-label="Editar produto">${Icons.edit}</button>
          <button class="icon-small-btn danger" data-remove-product="${p.id}" aria-label="Remover produto">${Icons.trash}</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="category-group-title">${cat.label}</div>${rows}`;
  }).join('');

  return `
    <div class="admin-panel">
      <h2>Adicionar produto</h2>
      <form class="form-row" id="form-add-product">
        <div style="display:flex;align-items:center;gap:.5rem;flex:0 0 auto;">
          ${addFormPreview || '<div class="product-icon" style="flex:0 0 42px;">🍽️</div>'}
          <input type="text" name="icon" id="add-prod-icon" placeholder="Emoji ou URL" style="flex:0 0 120px;" value="${Utils.escapeHtml(State.addProductDraft.icon)}">
        </div>
        <input type="text" name="name" id="add-prod-name" placeholder="Nome do produto" required style="flex:1 1 180px;" value="${Utils.escapeHtml(State.addProductDraft.name)}">
        <select name="category" id="add-prod-category">${CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===State.addProductDraft.category?'selected':''}>${c.label}</option>`).join('')}</select>
        <input type="number" step="0.01" min="0" name="price" id="add-prod-price" placeholder="Preço (R$)" required style="flex:0 0 130px;" value="${Utils.escapeHtml(State.addProductDraft.price)}">
        <button class="btn btn-primary" type="submit">Adicionar produto</button>
      </form>
    </div>
    <div class="admin-panel">
      <h2>Cardápio (${State.products.length} produtos)</h2>

function renderAdminHistory(){
  const stats = getDashboardStats();
  const totalAllTime = State.history.reduce((s,h)=>s+h.total,0);
  const ordersAllTime = State.history.length;
  const avgAllTime = ordersAllTime ? totalAllTime/ordersAllTime : 0;

  const entries = State.history.map(h => `
    <div class="history-card">
      <div class="history-card-top">
        <strong>Mesa ${Utils.pad2(h.tableNumber)}</strong>
        <span>${Utils.formatCurrency(h.total)}</span>
      </div>
      <time>${Utils.formatDateTime(h.closedAt)}</time>
      <div class="history-items">${h.items.map(i=>`${i.quantity}x ${Utils.escapeHtml(i.name)}`).join(' · ')}</div>
    </div>
  `).join('');

  return `
    <div class="stats-grid">
      ${statCard(Utils.formatCurrency(stats.revenueToday), 'Faturamento hoje', true)}
      ${statCard(stats.ordersToday, 'Atendimentos hoje')}
      ${statCard(Utils.formatCurrency(stats.avgTicket), 'Ticket médio hoje')}
      ${statCard(Utils.formatCurrency(totalAllTime), 'Faturamento total')}
      ${statCard(ordersAllTime, 'Atendimentos no total')}
      ${statCard(Utils.formatCurrency(avgAllTime), 'Ticket médio geral')}

      ${entries || '<div class="empty-note">Nenhum atendimento finalizado ainda.</div>'}

  `;
}

/* ============================== 8. EVENTOS ================================ */
function setupEvents(){
  const app = document.getElementById('app');

  app.addEventListener('click', async (e) => {
    // navegação
    const navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      const dest = navBtn.getAttribute('data-nav');
      if(dest==='dashboard') return Actions.goToDashboard();
      if(dest==='admin') return Actions.openAdmin();
      if(dest==='table') return Actions.openTable(navBtn.getAttribute('data-table-id'));
    }

    // filtros do dashboard
    const filterBtn = e.target.closest('[data-set-table-filter]');
    if(filterBtn){ State.tableStatusFilter = filterBtn.getAttribute('data-set-table-filter'); return render(); }

    // filtro de categoria (tela da mesa)
    const catBtn = e.target.closest('[data-set-category]');
    if(catBtn){ State.productCategory = catBtn.getAttribute('data-set-category'); return render(); }

    // abrir mesa
    const openTableBtn = e.target.closest('[data-open-table]');
    if(openTableBtn){ return Actions.openTable(openTableBtn.getAttribute('data-open-table')); }

    // clique no produto (adiciona 1 unidade ao pedido em construção)
    const minusOnProduct = e.target.closest('[data-dec-product]');
    if(minusOnProduct){
      e.stopPropagation();
      const productId = minusOnProduct.getAttribute('data-dec-product');
      const qty = Number(minusOnProduct.getAttribute('data-qty'));
      await Actions.decFromCart(State.currentTableId, productId, qty);
      return;
    }
    const productCard = e.target.closest('[data-add-product]');
    if(productCard){
      const productId = productCard.getAttribute('data-add-product');
      await Actions.addToCart(State.currentTableId, productId);
      return;
    }

    // carrinho: incrementar/decrementar/remover
    const cartInc = e.target.closest('[data-cart-inc]');
    if(cartInc){ await Actions.addToCart(State.currentTableId, cartInc.getAttribute('data-cart-inc')); return; }
    const cartDec = e.target.closest('[data-cart-dec]');
    if(cartDec){
      const qty = Number(cartDec.getAttribute('data-qty'));
      await Actions.decFromCart(State.currentTableId, cartDec.getAttribute('data-cart-dec'), qty);
      return;
    }
    const cartRemove = e.target.closest('[data-cart-remove]');
    if(cartRemove){ await Actions.removeFromCart(State.currentTableId, cartRemove.getAttribute('data-cart-remove')); return; }

    // enviar pedido / conta
    const sendBtn = e.target.closest('[data-send-order]');
    if(sendBtn){ await Actions.sendOrder(sendBtn.getAttribute('data-send-order')); return; }
    const billBtn = e.target.closest('[data-request-bill]');
    if(billBtn){ await Actions.requestBill(billBtn.getAttribute('data-request-bill')); return; }
    const finalizeBtn = e.target.closest('[data-finalize]');
    if(finalizeBtn){
      return Actions.openCheckout(finalizeBtn.getAttribute('data-finalize'));
    }
    const confirmFinalizeBtn = e.target.closest('[data-confirm-finalize]');
    if(confirmFinalizeBtn){
      await Actions.finalizeTable(
        confirmFinalizeBtn.getAttribute('data-confirm-finalize'),
        Number(confirmFinalizeBtn.getAttribute('data-total')),
        Number(confirmFinalizeBtn.getAttribute('data-number'))
      );
      return;
    }

    // administração — abas
    const adminTabBtn = e.target.closest('[data-set-admin-tab]');
    if(adminTabBtn){
      State.adminTab = adminTabBtn.getAttribute('data-set-admin-tab');
      State.editingTableId=null;
      State.editingProductId=null;
      State.editTableDraft='';
      State.editProductDraft={icon:'',name:'',category:'espetinhos',price:''};
      if(State.adminTab !== 'produtos') State.productPasswordInput = '';
      return render();
    }

    const addTableBtn = e.target.closest('[data-add-table]');
    if(addTableBtn){
      const number = await Database.addTable();
      showToast('Mesa ' + Utils.pad2(number) + ' adicionada');
      return render();
    }

    const reopenBtn = e.target.closest('[data-reopen-table]');
    if(reopenBtn){
      await Database.reopenTable(reopenBtn.getAttribute('data-reopen-table'));
      showToast('Mesa voltou para ocupada');
      return;
    }

    const confirmedDec = e.target.closest('[data-confirmed-dec]');
    if(confirmedDec){
      await Database.updateConfirmedItem(State.currentTableId, confirmedDec.getAttribute('data-confirmed-dec'), Number(confirmedDec.getAttribute('data-qty')) - 1);
      showToast('Pedido confirmado atualizado');
      return;
    }
    const confirmedInc = e.target.closest('[data-confirmed-inc]');
    if(confirmedInc){
      await Database.updateConfirmedItem(State.currentTableId, confirmedInc.getAttribute('data-confirmed-inc'), Number(confirmedInc.getAttribute('data-qty')) + 1);
      showToast('Pedido confirmado atualizado');
      return;
    }
    const confirmedRemove = e.target.closest('[data-confirmed-remove]');
    if(confirmedRemove){
      const reason = prompt('Motivo da remoção do item confirmado:');
      if(reason && reason.trim()){
        await Database.updateConfirmedItem(State.currentTableId, confirmedRemove.getAttribute('data-confirmed-remove'), 0, reason);
        showToast('Item confirmado removido');
      }
      return;
    }

    // administração — mesas
    const removeTableBtn = e.target.closest('[data-remove-table]');
    if(removeTableBtn && !removeTableBtn.disabled){
      const id = removeTableBtn.getAttribute('data-remove-table');
      if(confirm('Remover esta mesa? Esta ação não pode ser desfeita.')){
        try{ await Database.removeTable(id); showToast('Mesa removida'); }
        catch(err){ showToast(err.message); }
      }
      return;
    }

    // administração — produtos
    const editProductBtn = e.target.closest('[data-edit-product]');
    if(editProductBtn){
      const id = editProductBtn.getAttribute('data-edit-product');
      const p = State.products.find(p=>p.id===id);
      State.editingProductId = id;
      State.editProductDraft = p ? {icon:p.icon, name:p.name, category:p.category, price:String(p.price)} : {icon:'', name:'', category:'espetinhos', price:''};
      return render();
    }
    if(e.target.closest('[data-cancel-edit-product]')){ State.editingProductId=null; return render(); }
    const saveProductBtn = e.target.closest('[data-save-product]');
    if(saveProductBtn){
      const id = saveProductBtn.getAttribute('data-save-product');
      const name = State.editProductDraft.name.trim();
      const category = State.editProductDraft.category;
      const price = Number(State.editProductDraft.price);
      const icon = State.editProductDraft.icon.trim();
      if(name && price >= 0){
        await Database.updateProduct(id, {name, category, price, icon: icon || DEFAULT_ICON_BY_CATEGORY[category]});
      }
      State.editingProductId=null; return;
    }
    const removeProductBtn = e.target.closest('[data-remove-product]');
    if(removeProductBtn){
      const id = removeProductBtn.getAttribute('data-remove-product');
      if(confirm('Remover este produto do cardápio?')){
        await Database.removeProduct(id);
        showToast('Produto removido');
      }
      return;
    }
  });

  // campos de busca/formulários (input) — o valor digitado é guardado no
  // State antes de cada render, para não ser perdido se um re-render for
  // disparado por uma mudança vinda de outro aparelho enquanto o usuário
  // ainda está digitando.
  app.addEventListener('input', (e) => {
    const id = e.target.id;
    if(id === 'product-search-input'){ State.productSearch = e.target.value; return render(); }
    if(id === 'admin-product-password'){ State.productPasswordInput = e.target.value; return; }
    if(id === 'add-prod-icon'){ State.addProductDraft.icon = e.target.value; return; }
    if(id === 'add-prod-name'){ State.addProductDraft.name = e.target.value; return; }
    if(id === 'add-prod-category'){ State.addProductDraft.category = e.target.value; return; }
    if(id === 'add-prod-price'){ State.addProductDraft.price = e.target.value; return; }
    if(id === 'edit-prod-icon'){ State.editProductDraft.icon = e.target.value; return; }
    if(id === 'edit-prod-name'){ State.editProductDraft.name = e.target.value; return; }
    if(id === 'edit-prod-category'){ State.editProductDraft.category = e.target.value; return; }
    if(id === 'edit-prod-price'){ State.editProductDraft.price = e.target.value; return; }
  });

  // formulários de administração
  app.addEventListener('submit', async (e) => {
    if(e.target.id === 'form-add-table'){
      e.preventDefault();
      const number = await Database.addTable();
      State.showAddTableForm = false;
      showToast('Mesa ' + Utils.pad2(number) + ' adicionada');
      return render();
    }
    if(e.target.id === 'form-product-access'){
      e.preventDefault();
      const typed = String(State.productPasswordInput || '').trim();
      if(typed === PRODUCTS_PASSWORD){
        State.productAccessUnlocked = true;
        State.productPasswordInput = '';
        showToast('Acesso liberado');
        return render();
      }
      State.productPasswordInput = '';
      showToast('Senha incorreta');
      return render();
    }
    if(e.target.id === 'form-add-product'){
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = String(fd.get('name')||'').trim();
      const category = String(fd.get('category')||'outros');
      const price = Number(fd.get('price'));
      const icon = String(fd.get('icon')||'').trim();
      if(name && price >= 0){
        await Database.addProduct({name, category, price, icon});
        State.addProductDraft = {icon:'', name:'', category:'espetinhos', price:''};
        showToast('Produto adicionado');
        return render();
      }
      return;
    }
  });
}

/* ============================ 9. INICIALIZAÇÃO ============================ */
async function init(){
  await refreshCache();
  // Sempre que o Database notificar uma mudança (local ou de outra aba —
  // simulando múltiplos garçons/caixa em tempo real), atualiza o cache e
  // re-renderiza a tela atual automaticamente.
  Database.subscribe(async () => {
    await refreshCache();
    render();
  });
  Database.subscribeStatus(() => render());
  setupEvents();
  render();
}

init();
</script>
